<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>码布</title>
<style>
  body { background: #efece4; color: #2b2b2b; font: 15px/1.7 -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; margin: 0; padding: 18px; }
  #wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
  .intro { color: #555; margin: 0 0 14px; }
  #shelf { background: #fbfaf5; border: 1px solid #ddd8c8; border-radius: 6px; padding: 8px 12px; margin: 0 0 10px; }
  .bolt { display: flex; align-items: center; height: 26px; }
  .bolt .n { width: 1.6em; color: #999; font-size: 13px; }
  .bolt .c { width: 1.6em; font-size: 13px; color: #666; }
  .bolt .bar { height: 18px; border-radius: 9px; transition: width .3s; }
  .bolt.lit .bar { outline: 2px solid #c08a2a; }
  .gap { height: 14px; display: flex; align-items: center; padding-left: 3.2em; }
  .gap button { font-size: 11px; padding: 0 8px; line-height: 14px; }
  .青 { background: #4f6d7e; } .褐 { background: #8b6a4b; } .灰 { background: #a3a19b; }
  #out { font: 15px/1.6 "SF Mono", Menlo, "PingFang SC", monospace; white-space: pre-wrap; background: #fbfaf5; border: 1px solid #ddd8c8; border-radius: 6px; padding: 12px 14px; height: 34vh; overflow-y: auto; }
  #out .cmd { color: #8a5a20; }
  #out .old { color: #9a9a9a; }
  .row { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button { font: inherit; padding: 3px 12px; border: 1px solid #999; background: #fff; border-radius: 4px; cursor: pointer; }
  button:disabled { color: #bbb; border-color: #ddd; background: #f4f2ec; cursor: default; }
  .hint { color: #777; font-size: 13px; margin-top: 14px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>码布</h1>
  <p class="intro">一个小文字游戏。七天，十来分钟。有声音。</p>
  <div id="shelf"></div>
  <div class="row"><button id="stay">不动</button><button id="glide">手指再溜一遍</button><span id="day" class="hint" style="margin:0"></span></div>
  <div id="out"></div>
  <p class="hint"><button id="again">再开一局</button>　早上点两匹布中间的 ⇅ 换上下。从舒尔茨《淡季》来。</p>
</div>
<script src="布.js"></script>
<script>
var out = document.getElementById('out');
var game = null;
var FREQ = [0, 261.63, 293.66, 329.63, 349.23, 392.0, 440.0, 493.88];
var actx = null;
function addText(text, cls) {
  var d = document.createElement('div'); if (cls) d.className = cls; d.textContent = text; out.appendChild(d); return d;
}
function show(text, label) {
  out.querySelectorAll('.cur').forEach(function (e) { e.classList.remove('cur'); e.classList.add('old'); });
  var first = null;
  if (label) first = addText('> ' + label, 'cmd');
  var d = addText(text + '\n\n', 'cur');
  if (!first) first = d;
  out.scrollTop = first.offsetTop - out.offsetTop - 4;
}
function drawShelf() {
  var sh = document.getElementById('shelf'); sh.innerHTML = '';
  game.s.forEach(function (b, i) {
    if (i > 0) {
      var g = document.createElement('div'); g.className = 'gap';
      var bt = document.createElement('button'); bt.textContent = '⇅'; bt.title = '换' + i;
      bt.disabled = game.over;
      bt.onclick = (function (k) { return function () { doit(k); }; })(i);
      g.appendChild(bt); sh.appendChild(g);
    }
    var row = document.createElement('div'); row.className = 'bolt'; row.id = 'bolt' + i;
    var n = document.createElement('span'); n.className = 'n'; n.textContent = (i + 1);
    var c = document.createElement('span'); c.className = 'c'; c.textContent = COL[b];
    var bar = document.createElement('span'); bar.className = 'bar ' + COL[b]; bar.style.width = (40 + b * 48) + 'px';
    row.appendChild(n); row.appendChild(c); row.appendChild(bar); sh.appendChild(row);
  });
  document.getElementById('stay').disabled = game.over;
  document.getElementById('day').textContent = game.over ? '七天过完了' : '第 ' + game.day + ' 天早上';
}
function thud(b, t) {
  // 中午楼下那一声：落下的是哪匹布，闷声就是它的音，低一个八度。字里不写是哪个音。
  var o = actx.createOscillator(), gn = actx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(FREQ[b], t); o.frequency.exponentialRampToValueAtTime(FREQ[b] / 2, t + 0.08);
  gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(0.45, t + 0.01);
  gn.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
  o.connect(gn); gn.connect(actx.destination); o.start(t); o.stop(t + 0.65);
}
function noonSounds(ev) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var t = actx.currentTime + 0.3;
    ev.forEach(function (e) { thud(e[1], t); t += 0.9; });
    return ev.length ? 0.3 + ev.length * 0.9 + 0.4 : 0;
  } catch (e) { return 0; }
}
function glide(delay) {
  delay = delay || 0;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var t0 = actx.currentTime + 0.05 + delay;
    game.s.forEach(function (b, i) {
      var o = actx.createOscillator(), gn = actx.createGain();
      o.type = 'triangle'; o.frequency.value = FREQ[b];
      gn.gain.setValueAtTime(0, t0 + i * 0.22);
      gn.gain.linearRampToValueAtTime(0.25, t0 + i * 0.22 + 0.02);
      gn.gain.exponentialRampToValueAtTime(0.001, t0 + i * 0.22 + 0.5);
      o.connect(gn); gn.connect(actx.destination);
      o.start(t0 + i * 0.22); o.stop(t0 + i * 0.22 + 0.55);
      setTimeout(function () { var r = document.getElementById('bolt' + i); if (r) { r.classList.add('lit'); setTimeout(function () { r.classList.remove('lit'); }, 200); } }, (0.05 + delay + i * 0.22) * 1000);
    });
  } catch (e) { }
}
function resolve(delay) {
  delay = delay || 0;
  // 七个音停在西上，西要往上找多。只有第七夜信写成了，才补上那个高音多。
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var t = actx.currentTime + delay + 7 * 0.22 + 0.45;
    var o = actx.createOscillator(), gn = actx.createGain();
    o.type = 'triangle'; o.frequency.value = 523.25;
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(0.28, t + 0.03);
    gn.gain.exponentialRampToValueAtTime(0.001, t + 2.2);
    o.connect(gn); gn.connect(actx.destination); o.start(t); o.stop(t + 2.3);
  } catch (e) { }
}
function start() {
  out.innerHTML = '';
  game = newGame();
  drawShelf();
  show(OPEN + '\n\n—— 第 1 天早上 ——');
}
function doit(k) {
  if (!game || game.over) return;
  var text = act(game, k);
  var d = game.evening.day;
  text += '\n\n—— 第 ' + d + ' 天晚上 ——\n  手指从上往下一溜：' + runText(game.s) + (game.evening.scale ? '\n  ……是一串音阶。' : '');
  if (game.over) text += '\n\n—— 完了 ——\n' + endText(game);
  else text += '\n\n—— 第 ' + game.day + ' 天早上 ——';
  drawShelf();
  show(text, k ? '换' + k : '不动');
  var dl = noonSounds(game.log[game.log.length - 1].ev);
  glide(dl);
  if (game.over && isTarget(game.s)) resolve(dl);
}
document.getElementById('stay').onclick = function () { doit(0); };
document.getElementById('glide').onclick = function () { glide(0); };
document.getElementById('again').onclick = start;
start();
</script>
</body>
</html>
